<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GitHub Sound - Convierte tus contribuciones en música</title>
    <meta name="description" content="Transforma tu actividad de GitHub en composiciones musicales únicas. Genera y descarga música basada en tus contribuciones.">
    <meta name="keywords" content="github, music, contributions, audio, generative, web audio">
    <meta name="author" content="@holasoymalva">
    
    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://holasoymalva.github.io/github-sound/">
    <meta property="og:title" content="GitHub Sound - Convierte tus contribuciones en música">
    <meta property="og:description" content="Transforma tu actividad de GitHub en composiciones musicales únicas.">
    
    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image">
    <meta property="twitter:url" content="https://holasoymalva.github.io/github-sound/">
    <meta property="twitter:title" content="GitHub Sound">
    <meta property="twitter:description" content="Convierte tus contribuciones de GitHub en música">
    
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <canvas id="backgroundCanvas"></canvas>
    <div class="container">
        <h1>🎵 GitHub Music Generator</h1>
        <p class="subtitle">Convierte tus contribuciones de GitHub en música MIDI</p>
        
        <div class="input-section">
            <input 
                type="text" 
                id="username" 
                placeholder="Ingresa un usuario de GitHub"
                autocomplete="off"
            />
            <button id="generate">Generar Música</button>
        </div>

        <div id="loading" class="loading hidden">
            <div class="spinner"></div>
            <p>Obteniendo contribuciones...</p>
        </div>

        <div id="error" class="error hidden"></div>

        <div id="results" class="results hidden">
            <div class="stats">
                <h3>Estadísticas</h3>
                <p>Total de contribuciones: <span id="totalContributions">0</span></p>
                <p>Días activos: <span id="activeDays">0</span></p>
            </div>

            <div class="visualization">
                <canvas id="contributionsCanvas"></canvas>
            </div>

            <div class="controls">
                <button id="playPreview">▶️ Reproducir</button>
                <button id="download">⬇️ Descargar Audio</button>
            </div>
        </div>
    </div>

    <script type="module" src="/src/app.js"></script>
</body>
</html>
